<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Storybook 360 Reader</title>
  <link rel="stylesheet" href="vendor/pannellum.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="title">Storybook 360 Reader</div>
      <div class="page-indicator" id="pageIndicator"></div>
    </header>

    <div id="viewer" class="viewer"></div>

    <section class="panel">
      <div class="controls">
        <button id="prevBtn">Prev</button>
        <button id="playBtn">Play</button>
        <button id="autoBtn">Auto</button>
        <button id="nextBtn">Next</button>
        <button id="resetBtn">Reset View</button>
      </div>

      <div class="text" id="pageText"></div>
    </section>
  </div>

  <audio id="audio" preload="auto"></audio>
  <audio id="flipAudio" preload="auto" src="assets/sfx/page_flip.wav"></audio>

  <script src="vendor/pannellum.js"></script>
  <script src="app.js"></script>
</body>
</html>

services:
  mysql:
    image: mysql:8.0
    container_name: storybook-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: storybook
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:latest
    container_name: storybook-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # --- 新增的后端服务板块 ---
  app:
    build: ../backend-kotlin
    volumes:
      - ../backend-kotlin:/app
    container_name: storybook-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://storybook-mysql:3306/storybook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

  paddleocr-service:
    build: ../paddleocr-service
    container_name: storybook-paddleocr-service
    ports:
      - "8001:8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:

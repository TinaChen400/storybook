# Database configuration (Hardcoded for dev convenience)
spring.datasource.url=jdbc:mysql://storybook-mysql:3306/storybook?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update

# File Upload Configuration (Increased to 500MB for large PDFs)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.tomcat.max-swallow-size=500MB

# Serve static files from the uploads directory
spring.web.resources.static-locations=file:/app/uploads/,classpath:/static/